<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从零学 AI · 全中文 AI 工程学习平台</title>
<meta name="description" content="590 节全中文 AI 工程课：20 个阶段主线 + 2 条认证备考线。课本、练习、进度追踪、结业证书，全部免费。课程内容来自 ai-engineering-from-scratch（MIT）。">
<script src="data/manifest.js"></script>
<style>
:root {
  --page-bg:#f4f3f0; --surface-card:#fcfbf8; --surface-nested:#f7f6f1;
  --border:#ecebe5; --border-input:#e0ded6;
  --text:#232220; --text-secondary:#8f8a80; --text-tertiary:#b6b1a6;
  --accent:#2f2e2b; --accent-muted:#efeee8; --on-accent:#f4f3f0;
  --module-1:#6f8f6a; --module-2:#5f7a99; --module-3:#bd8a4e; --module-4:#b5715a; --module-5:#7d7195;
  --danger:#c25d4f; --danger-muted:#f6ece9;
  --drawer-bg:#232220; --drawer-bg-top:#2d2c29; --drawer-text:#f4f3f0; --drawer-text-mute:rgba(244,243,240,.55);
  --drawer-hover:rgba(244,243,240,.08); --drawer-active:rgba(244,243,240,.12);
  --radius-control:8px; --radius-tile:12px; --radius-card:16px; --radius-sheet:22px;
  --shadow-card:0 1px 2px rgba(35,34,32,.04),0 4px 16px rgba(35,34,32,.05);
  --shadow-overlay:0 10px 28px rgba(35,34,32,.12);
  --font:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,"JetBrains Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{color:var(--module-2)}
::selection{background:rgba(95,122,153,.25)}

/* ---------- 布局骨架 ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#nav{background:linear-gradient(180deg,var(--drawer-bg-top),var(--drawer-bg));color:var(--drawer-text);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--module-2),var(--module-5));display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:15.5px;letter-spacing:.5px}
.brand-sub{font-size:10.5px;color:var(--drawer-text-mute);letter-spacing:.4px;margin-top:1px}
.nav-sec{font-size:10.5px;color:var(--drawer-text-mute);letter-spacing:1.5px;padding:14px 12px 5px;text-transform:uppercase}
.navi{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-tile);font-size:13.5px;color:rgba(244,243,240,.82);cursor:pointer;transition:.15s}
.navi:hover{background:var(--drawer-hover)}
.navi.active{background:var(--drawer-active);color:var(--drawer-text);font-weight:600}
.navi svg{opacity:.7}
.navi.active svg{opacity:1}
.nav-foot{margin-top:auto;padding:14px 12px;font-size:11px;color:var(--drawer-text-mute);line-height:1.8;border-top:1px solid rgba(244,243,240,.1)}
.nav-foot b{color:rgba(244,243,240,.8)}

#screen{padding:26px 34px 60px;max-width:1180px;width:100%;margin:0 auto}
.header{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.header h2{font-size:21px;letter-spacing:.3px}
.header p{color:var(--text-secondary);font-size:12.5px;margin-top:3px}
.date-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);background:var(--surface-card);border:1px solid var(--border);border-radius:99px;padding:5px 12px;flex:none}
.spacer{flex:1}
.card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.sec-title{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--text-tertiary);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}

/* ---------- 首页 ---------- */
.hero{background-image:url('assets/hero-bg.jpg');background-size:cover;background-position:center 38%;border-radius:var(--radius-card);color:var(--text);padding:34px 38px;position:relative;overflow:hidden;box-shadow:var(--shadow-card)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(252,251,248,.95) 0%,rgba(252,251,248,.86) 34%,rgba(252,251,248,.42) 66%,rgba(252,251,248,.08) 100%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(to top,rgba(252,251,248,.62),transparent);pointer-events:none}
.hero h1{font-size:25px;letter-spacing:.5px;position:relative;z-index:2}
.hero .tag{color:var(--text-secondary);font-size:13px;margin-top:8px;max-width:560px;position:relative;z-index:2}
.hero .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative;z-index:2}
.hstat{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:6px 14px;font-size:12.5px;display:flex;gap:6px;align-items:center;color:var(--text);box-shadow:0 1px 6px rgba(35,34,32,.05)}
.hstat b{font-size:14px}
.hstat .dot{width:6px;height:6px;border-radius:50%;background:var(--module-1)}
body.scene-on{background:transparent}
body.scene-on::before{content:"";position:fixed;inset:0;background:url('assets/hero-bg.jpg') center 42% / cover no-repeat;opacity:.055;pointer-events:none;z-index:-1}
html{background:var(--page-bg)}

.resume{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-top:14px}
.resume-card{padding:18px 22px;display:flex;align-items:center;gap:18px}
.resume-ic{width:46px;height:46px;border-radius:12px;background:var(--accent-muted);display:grid;place-items:center;color:var(--accent);flex:none}
.resume-t{font-size:15px;font-weight:600}
.resume-m{font-size:12.5px;color:var(--text-secondary);margin-top:2px}
.quote-card{padding:18px 22px;display:flex;flex-direction:column;justify-content:center}
.quote-txt{font-size:13.5px;line-height:1.7}
.quote-src{font-size:11px;color:var(--text-tertiary);margin-top:6px}

.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.path-card{padding:20px 22px;cursor:pointer;transition:.18s;border-top:3px solid var(--pc,var(--module-2));display:flex;flex-direction:column;gap:8px}
.path-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-overlay)}
.path-tag{font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--pc,var(--module-2))}
.path-name{font-size:16px;font-weight:700}
.path-desc{font-size:12.5px;color:var(--text-secondary);flex:1}
.path-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-tertiary)}
.path-bar{height:5px;border-radius:99px;background:var(--surface-nested);overflow:hidden;flex:1}
.path-bar i{display:block;height:100%;background:var(--pc,var(--module-2));border-radius:99px}

.phase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.phase-card{padding:16px 17px;cursor:pointer;transition:.16s;position:relative}
.phase-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-overlay)}
.pc-num{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--pc);letter-spacing:1px}
.pc-name{font-size:14.5px;font-weight:650;margin-top:3px}
.pc-en{font-size:10px;color:var(--text-tertiary);margin-top:1px;min-height:13px}
.pc-bar{height:5px;border-radius:99px;background:var(--surface-nested);overflow:hidden;margin-top:10px}
.pc-bar i{display:block;height:100%;background:var(--pc);border-radius:99px;transition:width .4s}
.pc-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:7px}
.pc-done{position:absolute;top:13px;right:13px;width:20px;height:20px;border-radius:50%;background:var(--module-1);color:#fff;display:none;place-items:center}

/* ---------- 课本中心 ---------- */
.reader-wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start;margin-top:4px}
.lt-card{position:sticky;top:18px;max-height:calc(100vh - 40px);overflow-y:auto;padding:12px 8px}
.lt-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-secondary);padding:6px 12px 10px;letter-spacing:1px}
.lt-phase{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--radius-tile);cursor:pointer;font-size:12.5px;color:var(--text);transition:.13s}
.lt-phase:hover{background:var(--surface-nested)}
.lt-phase .lt-cnt{margin-left:auto;font-size:10.5px;color:var(--text-tertiary);background:var(--surface-nested);border-radius:99px;padding:1px 8px;flex:none}
.lt-phase .lt-cnt.all{background:var(--module-1);color:#fff}
.lt-arrow{transition:.2s;color:var(--text-tertiary);display:inline-flex}
.lt-arrow.open{transform:rotate(90deg)}
.lt-items{padding-left:8px}
.lt-item{display:flex;align-items:center;gap:7px;padding:5.5px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--text-secondary);transition:.12s}
.lt-item:hover{background:var(--surface-nested);color:var(--text)}
.lt-item.active{background:var(--accent-muted);color:var(--text);font-weight:600}
.lt-dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-input);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:0}
.lt-dot.ok{background:var(--module-1);border-color:var(--module-1)}
.lt-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lt-zh{font-size:9.5px;background:var(--module-3);color:#fff;border-radius:4px;padding:0 4px;flex:none}

.rd-card{padding:24px 30px 28px;min-height:520px}
.rd-welcome{padding:60px 30px;text-align:center;color:var(--text-secondary)}
.rw-big{color:var(--text-tertiary);display:flex;justify-content:center;margin-bottom:14px}
.rd-welcome h3{color:var(--text);font-size:19px;margin-bottom:10px}
.rd-welcome p{max-width:520px;margin:0 auto 8px;font-size:13.5px}
.rw-stat{margin-top:16px!important;font-size:13px!important}
.rd-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.badge-st{font-size:11px;font-weight:700;color:var(--module-2);background:rgba(95,122,153,.1);border-radius:6px;padding:3px 9px}
.badge-idx{font-size:11px;color:var(--text-tertiary)}
.badge{font-size:11px;border-radius:99px;padding:3px 10px;font-weight:600}
.rd-title{font-size:20px;line-height:1.45;margin-bottom:14px}
.rd-guide{background:rgba(189,138,78,.07);border:1px solid rgba(189,138,78,.22);border-radius:12px;padding:13px 16px;margin-bottom:16px}
.rd-guide .rg-t{font-size:11px;font-weight:700;color:var(--module-3);letter-spacing:1.2px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rd-guide p{font-size:13.5px;line-height:1.75}
.rg-task{margin-top:8px;font-size:13px;padding-top:8px;border-top:1px dashed rgba(189,138,78,.3)}
.rg-task b{color:var(--module-3)}
.rd-noguide{font-size:12.5px;color:var(--text-tertiary);background:var(--surface-nested);border-radius:10px;padding:9px 14px;margin-bottom:16px}
.rd-phase-intro{background:rgba(95,122,153,.06);border-left:3px solid var(--module-2);border-radius:0 10px 10px 0;padding:10px 16px;font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.rd-content{font-size:14px;line-height:1.8;color:#33322e;overflow-wrap:anywhere}
.rd-content img,.rd-content svg{max-width:100%}
.rd-content h2{font-size:17.5px;margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
.rd-content h3{font-size:15.5px;margin:20px 0 8px}
.rd-content h4{font-size:14px;margin:16px 0 6px}
.rd-content p{margin:9px 0}
.rd-content ul,.rd-content ol{margin:9px 0 9px 22px}
.rd-content li{margin:4px 0}
.rd-content code{background:var(--surface-nested);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:12.5px}
.md-pre{background:var(--drawer-bg);color:var(--drawer-text);border-radius:10px;padding:13px 16px;overflow-x:auto;margin:13px 0;font-size:12.5px;line-height:1.6}
.md-pre code{background:none;border:none;color:inherit;padding:0}
.tb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.md-tb{border-collapse:collapse;width:100%;margin:13px 0;font-size:12.5px}
.md-tb th{background:var(--surface-nested);text-align:left;font-weight:600}
.md-tb th,.md-tb td{border:1px solid var(--border);padding:7px 11px;vertical-align:top}
.rd-content blockquote{border-left:3px solid var(--module-3);background:rgba(189,138,78,.05);margin:12px 0;padding:9px 16px;border-radius:0 8px 8px 0;color:var(--text-secondary)}
.rd-ship{background:rgba(111,143,106,.07);border:1px solid rgba(111,143,106,.25);border-radius:12px;padding:13px 16px;margin:18px 0}
.rd-ship .rg-t{color:var(--module-1)}
.rd-actions{display:flex;align-items:center;gap:9px;margin-top:26px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.rbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 17px;border-radius:var(--radius-tile);font-size:13px;font-weight:600;border:1px solid var(--border-input);background:var(--surface-card);transition:.15s}
.rbtn:hover{border-color:var(--accent)}
.rbtn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rbtn.primary:hover{opacity:.88}
.rbtn.ghost{background:var(--surface-nested);color:var(--text-secondary)}
.rbtn.ok{background:var(--module-1);color:#fff;border-color:var(--module-1)}
.rbtn.bad{background:var(--danger-muted);color:var(--danger)}
.rbtn:disabled{opacity:.4;cursor:not-allowed}
.rd-progress{font-size:12px;color:var(--text-tertiary)}
.loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;color:var(--text-tertiary);font-size:13px}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 练习中心 ---------- */
.ex-seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{font-size:12px;padding:6px 14px;border-radius:99px;border:1px solid var(--border-input);cursor:pointer;color:var(--text-secondary);background:var(--surface-card);transition:.13s}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ex-group{font-size:12px;font-weight:700;color:var(--pc,var(--module-2));letter-spacing:1px;padding:16px 14px 6px}
.ex-list{padding:6px 14px 12px}
.ex-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.13s;border:1px solid transparent}
.ex-row:hover{background:var(--surface-nested);border-color:var(--border)}
.ex-mid{flex:1;min-width:0}
.ex-t{font-size:13.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-meta{font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
.ex-detail{padding:24px 30px}
.quiz-card{background:var(--surface-nested);border:1px solid var(--border);border-radius:var(--radius-card);padding:15px 18px;margin:10px 0}
.quiz-q{font-size:14px;font-weight:600;line-height:1.6}
.quiz-no{display:inline-grid;place-items:center;background:var(--accent);color:var(--on-accent);border-radius:6px;font-size:11px;padding:1px 7px;margin-right:8px;font-family:var(--mono)}
.quiz-a{margin-top:11px}
.qa-box{background:var(--surface-card);border:1px solid var(--border);border-radius:10px;padding:11px 15px;font-size:13.5px;line-height:1.75;color:var(--text)}
.quiz-ctl{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}
.q-mark{font-size:12.5px;font-weight:700}
.q-mark.ok{color:var(--module-1)}
.q-mark.bad{color:var(--danger)}

/* ---------- 搜索 ---------- */
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-input{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface-card);border:1px solid var(--border-input);border-radius:var(--radius-tile);padding:11px 17px}
.search-input:focus-within{box-shadow:0 0 0 3px var(--accent-muted)}
.search-input input{border:none;outline:none;background:none;font-size:14px;flex:1;color:var(--text)}
.sr-group{font-size:11px;font-weight:700;color:var(--pc,var(--module-2));letter-spacing:1.2px;padding:14px 14px 4px}
.sr-row{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer}
.sr-row:hover{background:var(--surface-nested)}
.sr-t{font-size:13.5px;font-weight:550}
.sr-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sr-ex{background:var(--surface-nested);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text-secondary);margin-top:5px;max-height:72px;overflow:hidden}
.sr-ex mark{background:rgba(189,138,78,.3);border-radius:3px;padding:0 2px;color:var(--text)}

/* ---------- 档案 ---------- */
.profile-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.p-stat{padding:16px 18px;text-align:left}
.p-v{font-size:24px;font-weight:750;font-family:var(--mono)}
.p-l{font-size:11.5px;color:var(--text-secondary);margin-top:3px}
.name-row{display:flex;align-items:center;gap:10px;padding:16px 20px}
.name-row input{border:1px solid var(--border-input);border-radius:var(--radius-tile);padding:8px 14px;font-size:14px;background:var(--surface-card);color:var(--text);outline:none;width:100%}
.name-row input:focus{box-shadow:0 0 0 3px var(--accent-muted)}
.cert-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cert-card{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.cc-name{font-size:13.5px;font-weight:650}
.cc-bar{height:5px;border-radius:99px;background:var(--surface-nested);overflow:hidden}
.cc-bar i{display:block;height:100%;background:var(--pc);border-radius:99px}
.cc-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--text-secondary)}
.cc-btn{font-size:11.5px;font-weight:700;padding:5px 13px;border-radius:99px;background:var(--module-3);color:#fff;cursor:pointer;align-self:flex-start}
.cc-btn[disabled]{background:var(--surface-nested);color:var(--text-tertiary);cursor:not-allowed}

/* ---------- 关于 ---------- */
.about-card{padding:26px 30px;max-width:760px}
.about-card h3{font-size:15.5px;margin:22px 0 8px}
.about-card p{font-size:13.5px;color:var(--text-secondary);margin:8px 0;line-height:1.8}
.about-card b{color:var(--text)}

/* ---------- 通用 ---------- */
.footer-note{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-tertiary);line-height:1.9}
.footer-note a{color:var(--text-secondary)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;color:var(--text-tertiary);font-size:13px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--drawer-bg);color:var(--drawer-text);padding:10px 22px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:var(--shadow-overlay)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.topbar{display:none}

/* ---------- 证书弹层 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(35,34,32,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal-mask.show{display:flex}
.cert-modal{background:var(--surface-card);border-radius:var(--radius-sheet);padding:22px;max-width:640px;width:100%;box-shadow:var(--shadow-overlay)}
.cert-modal canvas{width:100%;border-radius:12px;display:block}
.cert-modal .cm-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}

/* ---------- 响应式 ---------- */

<script>
/* ============================================================
   从零学 AI · 发布版学习平台
   课程数据：data/manifest.js（索引）+ data/pXX.js（按阶段懒加载）
   进度档案：localStorage + 导出/导入 JSON
   内容版权：rohitg00/ai-engineering-from-scratch (MIT)
   中文翻译：Fancyboi999/ai-engineering-from-scratch-zh (MIT)
   导读与自测题：本平台原创
   ============================================================ */
const M = window.__MANIFEST;
const STORE_KEY = "ai-course-platform-v1";
const PHASE_COLORS = ["var(--module-2)","var(--module-1)","var(--module-3)","var(--module-4)","var(--module-5)"];

const PATHS = [
  { key:"path-lite", tag:"路线 A · 实用主义", pc:"var(--module-1)", name:"普通人用好 AI",
    desc:"不想成为工程师，只想把 AI 用明白：Prompt、RAG、工具调用、多模态、安全常识，够用且止步。", steps:["p11","p13","p12","p18"] },
  { key:"path-pro", tag:"路线 B · 系统转行", pc:"var(--module-2)", name:"准 AI 工程师",
    desc:"完整就业路线：数学 → 机器学习 → 深度学习 → Transformers → 手造 LLM → 工程 → Agent → 生产部署。", steps:["p00","p01","p02","p03","p07","p10","p11","p13","p14","p17"] },
  { key:"path-builder", tag:"路线 C · 亲手造产品", pc:"var(--module-3)", name:"AI 产品创造者",
    desc:"以做产品为导向：语音与音频 → LLM 工程 → 多模态 → 工具协议 → 多智能体 → 生产上线 → 毕业项目。", steps:["p06","p11","p12","p13","p14","p16","p17","p19"] },
];

const QUOTES = [
  "学 AI 最好的时机是上周，其次是今天早上。",
  "别囤课，今天只啃透一个知识点就算赢。",
  "看不懂源码就抄一遍，手比眼睛诚实。",
  "卡住的地方，就是下一节课在等你。",
  "把本周学的讲给别人听，讲得清才算学会。",
  "造一个玩具版，比读十篇教程记得牢。",
  "复盘进度，给下周排满一格就够。",
];

/* ---------- 状态 ---------- */
const DATA_DEFAULT={ name:"", done:{}, quiz:{}, ship:{}, last:null, certs:{}, wb:{}, log:{} };
let data = (()=>{ try{ const r=localStorage.getItem(STORE_KEY); if(r) return Object.assign(JSON.parse(JSON.stringify(DATA_DEFAULT)), JSON.parse(r)); }catch(e){}
  return JSON.parse(JSON.stringify(DATA_DEFAULT)); })();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){} }
let view="home", searchQ="", exFilter="all", wbTab="todo", shipFilter="all";
let readerLesson=null, exLesson=null, ltExpand={};

/* ---------- 数据访问 ---------- */
const phaseByKey = {}; M.phases.forEach((p,i)=>{ p._i=i; p._color=PHASE_COLORS[i%PHASE_COLORS.length]; phaseByKey[p.key]=p; });
const mainPhases = M.phases.filter(p=>p.track==="main");
const certPhases = M.phases.filter(p=>p.track==="cert");
function allLessonsFlat(){ return M.phases.flatMap(p=>p.lessons); }
function phaseOf(id){ return M.phases.find(p=>p.lessons.some(x=>x.id===id))||null; }
function lessonMeta(id){ for(const p of M.phases){ const l=p.lessons.find(x=>x.id===id); if(l) return l; } return null; }
function prevNext(id){ const f=allLessonsFlat(); const i=f.findIndex(x=>x.id===id);
  return { prev:i>0?f[i-1]:null, next:i>=0&&i<f.length-1?f[i+1]:null }; }
function lessonDone(id){ return !!data.done[id]; }
function quizScore(id){ const a=(data.quiz[id]||[]); const tot=(M.quiz[id]||[]).length; return { ok:a.filter(x=>x===1).length, all:a.length, tot }; }
function shipDone(id){ return !!data.ship[id]; }
function phaseProgress(p){ const d=p.lessons.filter(l=>data.done[l.id]).length; return { done:d, total:p.lessons.length, pct:p.lessons.length?Math.round(d/p.lessons.length*100):0 }; }
function totalProgress(){ const all=allLessonsFlat(); const d=all.filter(l=>data.done[l.id]).length;
  return { done:d, total:all.length, pct:all.length?Math.round(d/all.length*100):0 }; }

/* ---------- 学习记录 / 错题本 / 实战 统计 ---------- */
function todayStr(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
function bumpLog(){ const t=todayStr(); data.log[t]=(data.log[t]||0)+1; }
function streakDays(){ const set=new Set(Object.keys(data.log||{}).filter(k=>data.log[k]>0));
  let n=0; const d=new Date();
  for(;;){ const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(set.has(k)){ n++; d.setDate(d.getDate()-1); } else break; }
  return n; }
function wrongStats(){ let pend=0,fix=0; Object.values(data.wb||{}).forEach(w=>{ if(w&&w.ok) fix++; else pend++; }); return {pend,fix}; }
function shipTotalLessons(){ return allLessonsFlat().filter(l=>l.s>0).length; }
function shipDoneCount(){ return allLessonsFlat().filter(l=>l.s>0&&data.ship[l.id]).length; }
function quizAnswered(){ let a=0; Object.values(data.quiz).forEach(arr=>{ if(arr) arr.forEach(x=>{ if(x!==undefined) a++; }); }); return a; }
function updateNavBadges(){ const b=$("#navWrong"); if(!b) return; const w=wrongStats().pend; b.hidden=w===0; b.textContent=w; }
function buildHeatmap(weeks=13){
  const cells=[]; const now=new Date(); now.setHours(0,0,0,0);
  const dow=(now.getDay()+6)%7;
  const start=new Date(now); start.setDate(start.getDate()-dow-(weeks-1)*7);
  for(let d=new Date(start); d<=now; d.setDate(d.getDate()+1)){
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const n=data.log[k]||0;
    cells.push(`<span class="hm-cell ${n===0?"":n<3?"l1":n<6?"l2":n<10?"l3":"l4"}" title="${k} · ${n} 次学习动作"></span>`);
  }
  return cells.join("");
}

/* ---------- 懒加载器 ---------- */
const P = window.__P = window.__P || {};
const loadedPhases = {}, pendingPhases = {};
function loadPhase(key){
  if(loadedPhases[key]) return Promise.resolve(P[key]);
  if(pendingPhases[key]) return pendingPhases[key];
  pendingPhases[key] = new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="data/"+key+".js";
    s.onload=()=>{ loadedPhases[key]=true; res(P[key]); };
    s.onerror=()=>{ delete pendingPhases[key]; rej(new Error("加载失败 data/"+key+".js")); };
    document.head.appendChild(s);
  });
  return pendingPhases[key];
}
function lessonBody(id){
  const p=phaseOf(id); if(!p) return null;
  const bucket=P[p.key]; if(!bucket) return null;
  return bucket.lessons.find(l=>l.id===id)||null;
}

/* ---------- markdown 渲染 ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }
function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdBlocks(seg){
  const lines=seg.split('\n');
  let html='', listType=null, listBuf=[], paraBuf=[], tableBuf=[], quoteBuf=[];
  const flushPara=()=>{ if(paraBuf.length){ html+='<p>'+paraBuf.map(mdInline).join('<br>')+'</p>'; paraBuf=[]; } };
  const flushList=()=>{ if(listBuf.length){ html+='<'+listType+'>'+listBuf.map(x=>'<li>'+mdInline(x)+'</li>').join('')+'</'+listType+'>'; listBuf=[]; listType=null; } };
  const flushTable=()=>{ if(tableBuf.length){
      html+='<div class="tb-scroll"><table class="md-tb">'+tableBuf.map((r,ri)=>{ const cells=r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
        if(ri===1 && cells.length && /^[-: ]*$/.test(cells.join(''))) return '';
        const tag=(ri===0?'th':'td'); return '<tr>'+cells.map(c=>'<'+tag+'>'+mdInline(c)+'</'+tag+'>').join('')+'</tr>'; }).join('')+'</table></div>'; tableBuf=[]; } };
  const flushQuote=()=>{ if(quoteBuf.length){ html+='<blockquote>'+quoteBuf.map(mdInline).join('<br>')+'</blockquote>'; quoteBuf=[]; } };
  const flushAll=()=>{ flushPara(); flushList(); flushTable(); flushQuote(); };
  for(const raw of lines){
    const line=raw.trim();
    if(!line){ flushAll(); continue; }
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flushAll(); const lv=Math.min(h[1].length,4); html+='<h'+(lv+1)+' class="md-h">'+mdInline(h[2])+'</h'+(lv+1)+'>'; continue; }
    if(/^(-{3,}|\*{3,})$/.test(line)){ flushAll(); html+='<hr>'; continue; }
    if(line.startsWith('|')){ flushPara(); flushList(); flushQuote(); tableBuf.push(line); continue; }
    if(line.startsWith('>')){ flushPara(); flushList(); flushTable(); quoteBuf.push(line.replace(/^>\s?/,'')); continue; }
    const ul=line.match(/^[-*+]\s+(.*)$/); const ol=line.match(/^\d+[.)]\s+(.*)$/);
    if(ul){ flushPara(); flushTable(); flushQuote(); if(listType!=='ul'){ flushList(); listType='ul'; } listBuf.push(ul[1]); continue; }
    if(ol){ flushPara(); flushTable(); flushQuote(); if(listType!=='ol'){ flushList(); listType='ol'; } listBuf.push(ol[1]); continue; }
    flushList(); flushTable(); flushQuote(); paraBuf.push(line);
  }
  flushAll();
  return html;
}
function mdRender(src){
  if(!src) return '';
  src=String(src).replace(/\r\n/g,'\n');
  const parts=src.split('```');
  let html='';
  for(let i=0;i<parts.length;i++){
    if(i%2===1){
      const t=parts[i].replace(/^[a-zA-Z0-9+#.\/_-]*\n/,'');
      html+='<pre class="md-pre"><code>'+esc(t)+'</code></pre>';
    } else html+=mdBlocks(parts[i]);
  }
  return html;
}

    const items=p.lessons.filter(l=>{
      const hasEx=l.z>0||l.s>0;
      if(!hasEx) return false;
      const sc=quizScore(l.id); const attempted=sc.all>0;
      const finished=data.done[l.id]&&(!l.z||sc.all>=l.z)&&(!l.s||shipDone(l.id));
      if(exFilter==="todo") return !finished;
      if(exFilter==="done") return finished;
      if(exFilter!=="all" && p.key!==exFilter) return false;
      return true;
    });
    if(!items.length) return;
    rows.push(`<div class="ex-group" style="--pc:${p._color}">${p.num} · ${esc(p.name)}</div>`);
    items.forEach(l=>{
      const sc=quizScore(l.id);
      rows.push(`<div class="ex-row js-ex-row" data-id="${l.id}">
        <span class="lt-dot ${data.done[l.id]?'ok':''}">${icon("check",9,3)}</span>
        <div class="ex-mid"><div class="ex-t">${esc(l.title)}</div>
          <div class="ex-meta">${l.z?`自测 ${sc.ok}/${sc.tot}`:''}${l.s?` · SHIP IT ${shipDone(l.id)?'✓':'待做'}`:''}</div></div>
        ${icon("chevron",14,2)}</div>`);
    });
  });
  return rows.length? `<div class="card"><div class="ex-list">${rows.join("")}</div></div>`
    : `<div class="card"><div class="empty"><span>${icon("pen",26)}</span><div>该筛选下暂无练习</div></div></div>`;
}

function renderShip(){
  const chips=[{k:"all",l:"全部"},{k:"todo",l:"待做"},{k:"done",l:"已完成"}]
    .concat(M.phases.filter(p=>p.lessons.some(l=>l.s>0)).map(p=>({k:p.key,l:p.num})));
  const shipLessons=allLessonsFlat().filter(l=>l.s>0);
  const done=shipLessons.filter(l=>data.ship[l.id]).length;
  const pct=shipLessons.length?Math.round(done/shipLessons.length*100):0;

  const groups=[];
  M.phases.forEach(p=>{
    const items=p.lessons.filter(l=>{
      if(!l.s) return false;
      if(shipFilter==="todo") return !data.ship[l.id];
      if(shipFilter==="done") return !!data.ship[l.id];
      if(shipFilter!=="all" && p.key!==shipFilter) return false;
      return true; });
    if(!items.length) return;
    groups.push(`<div class="ex-group" style="--pc:${p._color}">${p.num} · ${esc(p.name)} <span style="font-weight:400;color:var(--text-tertiary)">· ${items.length} 个 SHIP IT</span></div>`);
    items.forEach(l=>{
      groups.push(`<div class="ship-row js-ship-row" data-id="${l.id}">
        <span class="ship-done-ic ${data.ship[l.id]?'ok':''}">${icon("check",15,2.6)}</span>
        <div style="flex:1;min-width:0"><div class="ex-t">${esc(l.title)}</div>
          <div class="ex-meta">${p.num} 实操作业 · 点击进入课文查看任务详情并交付</div></div>
        <span class="rbtn ghost js-ship-quick" data-id="${l.id}">${data.ship[l.id]?'撤销':'标记完成'}</span>
        ${icon("chevron",14,2)}</div>`);
    });
  });

  $("#screen").innerHTML=`<div class="header"><div><h2>实战训练</h2><p>SHIP IT 实操作业训练场 · 学一课交付一课 · 做出来的才叫学会</p></div>
      <div class="spacer"></div><span class="date-chip">${icon("hammer",13)} ${done}/${shipLessons.length} 已交付</span></div>
    <div class="card ship-stat">
      <div class="qs-ic" style="width:42px;height:42px;border-radius:11px;background:rgba(189,138,78,.14);color:var(--module-3);display:grid;place-items:center">${icon("bolt",20)}</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:650">实操作业总进度 ${done} / ${shipLessons.length}（${pct}%）</div>
        <div class="cv-bar" style="margin-top:8px"><i style="width:${pct}%;background:var(--module-3)"></i></div></div>
      <button class="rbtn primary js-ship-next">继续下一个待做 ${icon("chevron",13,2.4)}</button>
    </div>
    <div class="ex-seg">${chips.map(c=>`<div class="fchip ${shipFilter===c.k?'on':''} js-shipf" data-k="${c.k}">${esc(c.l)}</div>`).join('')}</div>
    <div class="card"><div class="ex-list">${groups.join("")||'<div class="empty"><div>该筛选下暂无实战作业</div></div>'}</div></div>
    ${footerNote()}`;

  document.querySelectorAll(".js-shipf").forEach(el=>el.onclick=()=>{ shipFilter=el.dataset.k; renderShip(); });
  document.querySelectorAll(".js-ship-row").forEach(el=>el.onclick=()=>{ readerLesson=el.dataset.id; data.last=el.dataset.id; save(); go("reader"); });
  document.querySelectorAll(".js-ship-quick").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const id=el.dataset.id;
    if(data.ship[id]) delete data.ship[id]; else { data.ship[id]=true; bumpLog(); }
    save(); renderShip(); });
  const nx=document.querySelector(".js-ship-next");
  if(nx) nx.onclick=()=>{ const next=shipLessons.find(l=>!data.ship[l.id]);
    if(!next){ toast("全部 SHIP IT 已完成，太强了 🎉"); return; }
    readerLesson=next.id; data.last=next.id; save(); go("reader"); };
}

let deepIdx=null;
function renderSearch(){
  const q=searchQ.trim().toLowerCase();
  let results="";
  if(q){
    if(deepIdx){
      const hits=[];
      for(const p of M.phases){
        const bucket=P[p.key]; if(!bucket) continue;
        for(const l of bucket.lessons){
          const pos=l.md.toLowerCase().indexOf(q);
          if(pos>=0){
            const s=Math.max(0,pos-40);
            const ex=l.md.slice(s,s+110).replace(/[#*`>\n|]/g," ");
            hits.push({p,l,ex,pos});
            if(hits.length>=60) break;
          }
        }
        if(hits.length>=60) break;
      }
      results = hits.length? `<div class="card"><div class="ex-list">
        ${hits.map(h=>`<div class="sr-row js-sr" data-id="${h.l.id}">
          <div style="flex:1;min-width:0"><div class="sr-t">${esc(h.l.title)}</div>
          <div class="sr-sub">${h.p.num} ${esc(h.p.name)}</div>

      results=`<div class="sec-title">全文搜索结果（${hits.length}${hits.length>=60?'+':''} 条命中）</div>`+results;
    } else {
      const tpHits=[];
      for(const p of M.phases) for(const l of p.lessons){
        if(l.title.toLowerCase().includes(q)||(p.name+" "+p.nameEn).toLowerCase().includes(q)) tpHits.push({p,l});
      }
      const groups={};
      tpHits.forEach(h=>{ (groups[h.p.key]=groups[h.p.key]||[]).push(h); });
      results=Object.entries(groups).map(([k,hs])=>{
        const p=hs[0].p;

            ${icon("chevron",14,2)}</div>`).join("")}</div></div>`;
      }).join("");
      if(!tpHits) results=`<div class="card"><div class="empty"><span>${icon("search",26)}</span><div>标题中没有找到「${esc(searchQ)}」</div></div></div>`;
      results=`<div class="sec-title">标题搜索结果（${tpHits.length} 课）</div>`+(results||`<div class="card"><div class="empty"><span>${icon("search",26)}</span><div>标题中没有找到「${esc(searchQ)}」，试试下方全文搜索</div></div></div>`);
    }
  } else {
    results=`<div class="card"><div class="empty"><span>${icon("search",28)}</span><div>输入关键词搜索 ${M.counts.lessons} 节课的标题，或开启全文搜索</div></div></div>`;
  }
  $("#screen").innerHTML=`<div class="header"><div><h2>全局搜索</h2><p>标题搜索即时返回 · 全文搜索需加载全部课程数据（约 7MB，一次加载）</p></div></div>
    <div class="search-bar">
      <div class="search-input">${icon("search",16,2)}<input id="srInput" placeholder="搜索课程、概念、关键词…" value="${attr(searchQ)}"></div>
      <button class="rbtn ${deepIdx?'ok':'ghost'}" id="btnDeep">${deepIdx?'✓ 全文模式':'全文搜索'}</button>
    </div>
    ${results}`;
  const inp=$("#srInput");
  let composing=false;
  inp.addEventListener("compositionstart",()=>composing=true);
  inp.addEventListener("compositionend",()=>{ composing=false; searchQ=inp.value; renderSearch(); });
  inp.addEventListener("input",()=>{ if(!composing){ searchQ=inp.value; refreshResults(); } });
  function refreshResults(){ searchQ=inp.value; renderSearch(); const i=$("#srInput"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  $("#btnDeep").onclick=async()=>{
    if(deepIdx){ deepIdx=null; toast("已切回标题搜索"); renderSearch(); return; }
    const btn=$("#btnDeep"); btn.disabled=true;
    let done=0;
    for(const p of M.phases){
      if(!loadedPhases[p.key]){
        btn.textContent=`加载中 ${done}/${M.phases.length}…`;
        try{ await loadPhase(p.key); }catch(e){}
      }
      done++;
    }
    deepIdx=true; toast("全文搜索就绪"); renderSearch();
  };
  document.querySelectorAll(".js-sr").forEach(el=>el.onclick=()=>{ readerLesson=el.dataset.id; data.last=readerLesson; save(); go("reader"); });
}

/* ============================================================
   视图：学习档案
   ============================================================ */
function renderProfile(){
  const tp=totalProgress();
  const quizAll=Object.values(M.quiz).reduce((a,q)=>a+q.length,0);
  const quizDone=Object.entries(data.quiz).reduce((a,[id,arr])=>a+arr.filter(x=>x!==undefined).length,0);
  const quizOk=Object.entries(data.quiz).reduce((a,[id,arr])=>a+arr.filter(x=>x===1).length,0);
  const shipTotal=allLessonsFlat().filter(l=>l.s).length;
  const shipD=Object.keys(data.ship).length;
  const certsN=Object.keys(data.certs).length;

  const certWall=`<div class="sec-title">阶段结业卡</div><div class="cert-wall">${M.phases.map(p=>{
    const pr=phaseProgress(p);
    const ready=pr.pct===100;
    const has=!!data.certs[p.key];
    return `<div class="card cert-card" style="--pc:${p._color}">
      <div class="cc-name">${p.num} · ${esc(p.name)}</div>
      <div class="cc-bar"><i style="width:${pr.pct}%"></i></div>
      <div class="cc-meta"><span>${pr.done}/${pr.total} 课</span>
        <button class="cc-btn js-cert" data-key="${p.key}" ${ready?'':'disabled'}>${has?'查看结业卡':ready?'领取结业卡':'学完解锁'}</button></div>
    </div>`;
  }).join("")}</div>`;

  $("#screen").innerHTML=`<div class="header"><div><h2>学习档案</h2><p>进度、成绩与结业卡 · 数据保存在本设备浏览器 · 换设备前记得导出</p></div></div>
    <div class="card name-row">
      <span style="flex:none;color:var(--text-secondary);font-size:13px">学习者昵称</span>
      <input id="nameInput" placeholder="写上你的名字（会印在结业卡上）" value="${attr(data.name)}" maxlength="20">
    </div>
    <div class="p-stats">
      <div class="card p-stat"><div class="p-v" style="color:var(--module-2)">${tp.done}<span style="font-size:13px;color:var(--text-tertiary)">/${tp.total}</span></div><div class="p-l">已学课程 · 总进度 ${tp.pct}%</div></div>
      <div class="card p-stat"><div class="p-v" style="color:var(--module-3)">${quizOk}<span style="font-size:13px;color:var(--text-tertiary)">/${quizAll}</span></div><div class="p-l">自测答对（已作答 ${quizDone}）</div></div>
      <div class="card p-stat"><div class="p-v" style="color:var(--module-1)">${shipD}<span style="font-size:13px;color:var(--text-tertiary)">/${shipTotal}</span></div><div class="p-l">SHIP IT 作业完成</div></div>
    </div>
    <div class="profile-grid" style="margin-top:14px">
      <div class="card" style="padding:18px 22px">
        <div class="sec-title" style="margin-top:0">档案备份（换设备 / 防丢失）</div>
        <p style="font-size:13px;color:var(--text-secondary);line-height:1.8">导出一个 JSON 文件，包含你的全部学习进度、自测成绩、作业记录与结业卡记录。换电脑、换浏览器或清理浏览记录前，先导出一份。</p>
        <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button class="rbtn primary js-export">${icon("download",14,2)} 导出学习档案</button>
          <button class="rbtn js-import">${icon("upload",14,2)} 导入档案</button>
          <input type="file" id="importFile" accept=".json" hidden>
          <button class="rbtn ghost js-reset" style="color:var(--danger);border-color:var(--danger-muted)">清空全部进度</button>
        </div>
      </div>
      <div class="card" style="padding:18px 22px">
        <div class="sec-title" style="margin-top:0">学习概况</div>
        ${PATHS.map(pt=>{
          const ls=pt.steps.flatMap(k=>(phaseByKey[k]?phaseByKey[k].lessons:[]));
          const d=ls.filter(l=>data.done[l.id]).length;
          const pct=ls.length?Math.round(d/ls.length*100):0;
          return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
            <span>${esc(pt.name)}</span><span style="color:var(--text-tertiary)">${d}/${ls.length}</span></div>
            <div class="cc-bar"><i style="width:${pct}%;background:${pt.pc}"></i></div></div>`;
        }).join("")}
        <div style="font-size:11.5px;color:var(--text-tertiary);margin-top:12px">已领取结业卡：<b style="color:var(--module-3)">${certsN}</b> 张</div>
      </div>
    </div>
    ${certWall}
    ${footerNote()}`;

  $("#nameInput").onchange=e=>{ data.name=e.target.value.trim(); save(); toast("昵称已保存"); };
  document.querySelector(".js-export").onclick=()=>{
    const blob=new Blob([JSON.stringify({app:"ai-course-platform",version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`从零学AI-学习档案-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(a.href); toast("档案已导出");
  };
  const fi=$("#importFile");
  document.querySelector(".js-import").onclick=()=>fi.click();
  fi.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const j=JSON.parse(r.result);
      const d=j.data&&j.data.done!==undefined?j.data:j;
      if(!d.done) throw new Error("格式不对");
      data=Object.assign({name:"",done:{},quiz:{},ship:{},last:null,certs:{}},d);
      save(); render(); renderProfile(); toast("档案导入成功");
    }catch(err){ toast("导入失败："+err.message); } };
    r.readAsText(f); e.target.value="";
  };
  document.querySelector(".js-reset").onclick=()=>{
    if(!confirm("确定清空全部学习进度？此操作不可撤销（建议先导出备份）。")) return;
    data={name:data.name,done:{},quiz:{},ship:{},last:null,certs:{}};
    save(); renderProfile(); toast("已清空，重新出发");
  };
  document.querySelectorAll(".js-cert").forEach(el=>el.onclick=()=>{
    const p=phaseByKey[el.dataset.key];
    if(phaseProgress(p).pct!==100) return;
    data.certs[p.key]=new Date().toISOString().slice(0,10); save();
    showCert(p);
  });
}

/* ---------- 结业卡（canvas 绘制） ---------- */
let certCtx=null;
function showCert(p){
  const mask=$("#certMask");
  const cv=$("#certCanvas"); const ctx=cv.getContext("2d");
  const W=1200,H=675;
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,"#2d2c29"); grad.addColorStop(.55,"#3a3d45"); grad.addColorStop(1,"#4a4658");
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(244,243,240,.28)"; ctx.lineWidth=2; ctx.strokeRect(38,38,W-76,H-76);
  ctx.strokeStyle="rgba(244,243,240,.12)"; ctx.lineWidth=1; ctx.strokeRect(52,52,W-104,H-104);
  ctx.fillStyle="rgba(244,243,240,.6)"; ctx.font="600 26px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("从零学 AI · AI ENGINEERING",80,120);
  ctx.fillStyle="#f4f3f0"; ctx.font="700 58px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("阶段结业证书",80,210);
  ctx.fillStyle="rgba(244,243,240,.85)"; ctx.font="400 30px 'PingFang SC','Microsoft YaHei',sans-serif";
  const name=data.name||"一位坚持学习的人";
  ctx.fillText(`${name} 已完成`,80,310);
  ctx.font="700 46px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillStyle="#e6b877";
  ctx.fillText(`${p.num} ${p.name}`,80,375);
  ctx.fillStyle="rgba(244,243,240,.75)"; ctx.font="400 26px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText(`全部 ${p.lessons.length} 节课程 · ${p.nameEn}`,80,425);
  ctx.fillText(`结业日期 ${data.certs[p.key]||new Date().toISOString().slice(0,10)}`,80,475);
  ctx.fillStyle="rgba(244,243,240,.4)"; ctx.font="400 18px sans-serif";
  ctx.fillText("课程内容：ai-engineering-from-scratch (MIT) · 中文翻译：ai-engineering-from-scratch-zh (MIT) · 本证书由学习平台自动生成",80,H-70);
  ctx.fillStyle="#e6b877"; ctx.beginPath(); ctx.arc(W-170,H-160,52,0,Math.PI*2);
  ctx.strokeStyle="#e6b877"; ctx.lineWidth=3; ctx.stroke();
  ctx.font="700 44px serif"; ctx.textAlign="center"; ctx.fillText("毕",W-170,H-160+16); ctx.textAlign="left";
  mask.classList.add("show");
  certCtx={p};
  $("#certClose").onclick=()=>mask.classList.remove("show");
  $("#certDownload").onclick=()=>{ cv.toBlob(b=>{ const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=`结业卡-${p.num}-${p.name}-${data.name||"learner"}.png`; a.click(); URL.revokeObjectURL(a.href); toast("结业卡已保存"); }); };
}

  </div>

/* ============================================================
   路由与启动
   ============================================================ */
function render(){
  if(view==="home") renderHome();
  else if(view==="reader") renderReader();
  else if(view==="exercise") renderExercise();
  else if(view==="ship") renderShip();
  else if(view==="wrong") renderWrong();
  else if(view==="cert") renderCert();
  else if(view==="search") renderSearch();
  else if(view==="profile") renderProfile();
  else if(view==="about") renderAbout();
  document.body.classList.toggle("scene-on",view==="home");
  document.querySelectorAll("#nav .navi").forEach(el=>el.classList.toggle("active",el.dataset.go===view));
  $("#navDone").textContent=totalProgress().done;
  $("#navTotal").textContent=totalProgress().total;
}
document.querySelectorAll("#nav .navi").forEach(el=>el.onclick=()=>go(el.dataset.go));
$("#tbMenu").onclick=()=>{ const nav=$("#nav"), mk=$("#navMask"); const open=nav.classList.toggle("open"); mk.classList.toggle("show",open); };
$("#navMask").onclick=()=>{ $("#nav").classList.remove("open"); $("#navMask").classList.remove("show"); };
$("#certMask").onclick=e=>{ if(e.target.id==="certMask") e.target.classList.remove("show"); };
render();
</script>
